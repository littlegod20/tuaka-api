name: Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/tuaka-api
            git pull
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chown -R www-data:www-data /var/www/tuaka-api
            chmod -R 775 /var/www/tuaka-api/storage
            chmod -R 775 /var/www/tuaka-api/bootstrap/cache
            supervisorctl restart tuaka-horizon
            supervisorctl restart tuaka-scheduler
            echo "Deploy complete"